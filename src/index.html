<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OnDevice Tools — Free Browser-Based Tools</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A fast, private collection of free online utilities for developers, designers and writers. Everything runs in your browser — nothing is uploaded."
    />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!--
      Inter is self-hosted (see src/fonts.css). No third-party font request is
      made, which keeps the CSP free of external style and font hosts and means
      nothing is fetched from another origin before a visitor consents.
    -->
    <link
      rel="preload"
      href="fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Apply the stored theme before first paint. Without this the page renders
      light and then flips to dark once Angular boots, which is very visible.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('qt.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#09090b' : '#ffffff');
        } catch (e) {
          /* Storage blocked — fall back to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <p style="font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem">
          JavaScript is required
        </p>
        <p>
          OnDevice Tools runs entirely in your browser, so it needs JavaScript enabled. No data is ever
          sent to a server.
        </p>
      </div>
    </noscript>
  </body>
</html>
